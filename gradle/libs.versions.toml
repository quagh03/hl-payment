# Single catalog for hl-payment.
# Checked against spring-boot 4.1.2 on 2026-11-08:
# - org.testcontainers managed by spring-boot-dependencies: yes
# - Error Prone supports the Java 25 toolchain: yes
#
# spring-boot-dependencies 4.1.2 imports org.testcontainers:testcontainers-bom 2.0.5.
# That BOM manages org.testcontainers:testcontainers-junit-jupiter, so this catalog
# has no testcontainers version key.
# Error Prone 2.52.0 runs on JDK 21 and newer, including the Java 25 toolchain.
# net.ltgt.errorprone 5.2.0 is the plugin that applies it.

[versions]
spring-boot = "4.1.2"
jspecify = "1.0.1"
errorprone = "2.52.0"
errorprone-plugin = "5.2.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
errorprone = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
